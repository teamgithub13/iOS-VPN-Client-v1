workflows:
  ios-native-quick-start:
    name: iOS Native VPN
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: FastConfigApp

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gooseberry.colander

      vars:
        TEAM_ID: "AC3YWJKKRK"

        BUNDLE_ID_APP: "com.gooseberry.colander"
        BUNDLE_ID_TUNNEL: "com.gooseberry.colander.tunnel"

        PROFILE_NAME_APP: "Certificate vers1"
        PROFILE_NAME_TUNNEL: "tunnel profile"

        XCODE_PROJECT: "FastVPNApp.xcodeproj"
        XCODE_SCHEME: "FastVPNApp"

      xcode: 26.1
      cocoapods: default

    scripts:
      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles --verbose

      - name: DEBUG – list installed provisioning profiles
        script: |
          echo "=============================="
          echo "Provisioning Profiles directory:"
          echo "=============================="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

          echo ""
          echo "=============================="
          echo "Dumping installed provisioning profiles:"
          echo "=============================="

          for f in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            echo ""
            echo "FILE: $f"
            security cms -D -i "$f" > /tmp/profile.plist

            echo "Name:"
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist || true

            echo "UUID:"
            /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist || true

            echo "TeamIdentifier:"
            /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist || true

            echo "Application Identifier:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist || true

            echo "Has Network Extension entitlement:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.networking.networkextension" /tmp/profile.plist || echo "NO"
          done || true

      - name: Create ExportOptions.plist
        script: |
          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID_APP}</key>
              <string>${PROFILE_NAME_APP}</string>
              <key>${BUNDLE_ID_TUNNEL}</key>
              <string>${PROFILE_NAME_TUNNEL}</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "======= ExportOptions.plist ======="
          cat "$CM_BUILD_DIR/ExportOptions.plist"

      - name: Patch legacy target build tool (make)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          if command -v brew >/dev/null 2>&1; then
            export HOMEBREW_NO_AUTO_UPDATE=1
            export HOMEBREW_NO_INSTALL_CLEANUP=1
            brew install make
          fi

          PROJECT_PBX="$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          if [ ! -f "$PROJECT_PBX" ]; then
            echo "ERROR: project file not found: $PROJECT_PBX"
            exit 1
          fi

          WRAPPER_DIR="$CM_BUILD_DIR/ci"
          WRAPPER="$WRAPPER_DIR/make-wrapper.sh"
          mkdir -p "$WRAPPER_DIR"
          cat > "$WRAPPER" <<'EOF'
          #!/bin/sh
          set -e

          if command -v gmake >/dev/null 2>&1; then
            exec gmake "$@"
          fi

          if command -v make >/dev/null 2>&1; then
            exec make "$@"
          fi

          for p in /opt/homebrew/Cellar/make/*/bin/gmake /usr/local/Cellar/make/*/bin/gmake; do
            if [ -x "$p" ]; then
              exec "$p" "$@"
            fi
          done

          MAKE_XCRUN="$(xcrun --find make 2>/dev/null || true)"
          if [ -n "$MAKE_XCRUN" ] && [ -x "$MAKE_XCRUN" ]; then
            exec "$MAKE_XCRUN" "$@"
          fi

          echo "ERROR: make/gmake not found." >&2
          exit 1
          EOF
          chmod +x "$WRAPPER"

          perl -pi -e "s|buildToolPath = .*;|buildToolPath = $WRAPPER;|g" "$PROJECT_PBX"
          echo "Patched buildToolPath:"
          grep -n "buildToolPath" "$PROJECT_PBX"

      - name: Archive app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          PROJECT_PBX="$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          WRAPPER="$CM_BUILD_DIR/ci/make-wrapper.sh"
          if [ -x "$WRAPPER" ]; then
            perl -pi -e "s|buildToolPath = .*;|buildToolPath = $WRAPPER;|g" "$PROJECT_PBX"
          fi

          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/FastVPNApp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/FastVPNApp.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/profile.plist
      - $HOME/Library/MobileDevice/Provisioning Profiles/*.mobileprovision
    publishing:
        app_store_connect:
            auth: integration
            submit_to_testflight: false
