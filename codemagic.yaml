workflows:
  ios-native-quick-start:
    name: iOS Native VPN
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: FastConfigApp

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gooseberry.colander

      vars:
        TEAM_ID: "AC3YWJKKRK"

        BUNDLE_ID_APP: "com.gooseberry.colander"
        BUNDLE_ID_TUNNEL: "com.gooseberry.colander.tunnel"

        PROFILE_NAME_APP: "Certificate vers1"
        PROFILE_NAME_TUNNEL: "tunnel profile"

        XCODE_PROJECT: "FastVPNApp.xcodeproj"
        XCODE_SCHEME: "FastVPNApp"

      xcode: 26.1
      cocoapods: default

    scripts:
      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles --verbose

      - name: Fix Homebrew taps + install GNU make
        script: |
          set -e

          # Old/broken tap can break `brew update` on some images
          brew untap robotsandpencils/homebrew-made || true

          # Don't fail build if update has transient tap/network errors
          brew update || true

          # Install GNU make
          brew install make || brew upgrade make || true

          # Ensure `make` is available as "make" in PATH
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"

          echo "PATH=$PATH"
          echo "which make: $(which make)"
          make -v

      - name: Patch WireGuardGoBridgeiOS to run make via /usr/bin/env (Xcode 26 has no Developer/usr/bin/make)
        script: |
          set -e

          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          PBXPROJ_PATH="$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"

          if [ ! -f "$PBXPROJ_PATH" ]; then
            echo "ERROR: project.pbxproj not found at $PBXPROJ_PATH"
            exit 1
          fi

          echo "== Before patch (WireGuardGoBridgeiOS legacy target block) =="
          awk '
            BEGIN{p=0}
            /name = WireGuardGoBridgeiOS;/ {p=1}
            p==1 {print}
            p==1 && /};/ {exit}
          ' "$PBXPROJ_PATH" || true

          # 1) Replace buildToolPath of WireGuardGoBridgeiOS legacy target to /usr/bin/env
          # 2) Replace its buildArgumentsString from "$(ACTION)" to "make $(ACTION)"
          # Do it safely only inside the PBXLegacyTarget block for WireGuardGoBridgeiOS.
          python3 - <<'PY'
          import re, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          s = path.read_text()

          # Find PBXLegacyTarget block that contains: name = WireGuardGoBridgeiOS;
          # and patch buildToolPath + buildArgumentsString inside that block only.
          pattern = re.compile(r'(/\* WireGuardGoBridgeiOS \*/\s*=\s*\{\s*isa\s*=\s*PBXLegacyTarget;.*?name\s*=\s*WireGuardGoBridgeiOS;.*?\};)', re.S)

          m = pattern.search(s)
          if not m:
            print("ERROR: PBXLegacyTarget block for WireGuardGoBridgeiOS not found")
            sys.exit(1)

          block = m.group(1)

          # Patch buildToolPath
          block2 = re.sub(r'buildToolPath\s*=\s*[^;]+;', 'buildToolPath = /usr/bin/env;', block)

          # Patch buildArgumentsString
          # Accept existing: buildArgumentsString = "$(ACTION)"; or buildArgumentsString = $(ACTION);
          if re.search(r'buildArgumentsString\s*=', block2):
            block2 = re.sub(r'buildArgumentsString\s*=\s*"?\$\(\s*ACTION\s*\)"?;', 'buildArgumentsString = "make $(ACTION)";', block2)
          else:
            # If somehow missing, insert it
            block2 = block2.replace('buildToolPath = /usr/bin/env;', 'buildToolPath = /usr/bin/env;\n\t\t\tbuildArgumentsString = "make $(ACTION)";')

          if block2 == block:
            print("WARNING: No changes applied (unexpected), check pbxproj format")
          s2 = s[:m.start(1)] + block2 + s[m.end(1):]
          path.write_text(s2)
          print("OK: patched WireGuardGoBridgeiOS legacy target")
          PY
          "$PBXPROJ_PATH"

          echo "== After patch (WireGuardGoBridgeiOS legacy target block) =="
          awk '
            BEGIN{p=0}
            /name = WireGuardGoBridgeiOS;/ {p=1}
            p==1 {print}
            p==1 && /};/ {exit}
          ' "$PBXPROJ_PATH" || true

      - name: DEBUG – list installed provisioning profiles
        script: |
          set -e
          echo "=============================="
          echo "Provisioning Profiles directory:"
          echo "=============================="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

          echo ""
          echo "=============================="
          echo "Dumping installed provisioning profiles:"
          echo "=============================="

          for f in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            echo ""
            echo "FILE: $f"
            security cms -D -i "$f" > /tmp/profile.plist

            echo "Name:"
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist || true

            echo "UUID:"
            /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist || true

            echo "TeamIdentifier:"
            /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist || true

            echo "Application Identifier:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist || true

            echo "Has Network Extension entitlement:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.networking.networkextension" /tmp/profile.plist || echo "NO"
          done || true

      - name: Create ExportOptions.plist
        script: |
          set -e
          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID_APP}</key>
              <string>${PROFILE_NAME_APP}</string>
              <key>${BUNDLE_ID_TUNNEL}</key>
              <string>${PROFILE_NAME_TUNNEL}</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "======= ExportOptions.plist ======="
          cat "$CM_BUILD_DIR/ExportOptions.plist"

      - name: Archive app
        script: |
          set -e
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"

          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/FastVPNApp.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/FastVPNApp.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/profile.plist
      - $HOME/Library/MobileDevice/Provisioning Profiles/*.mobileprovision

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
